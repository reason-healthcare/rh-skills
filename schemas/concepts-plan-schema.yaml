# Concepts Plan Schema
# Process control file: topics/<topic>/process/plans/concepts-plan.yaml
# Written by: rh-skills promote plan <topic>   (when source front matter contains concepts)
# Enriched via: rh-skills promote concept enrich <topic> ...
# Reviewed via: rh-skills promote concept review <topic>
# Finalized via: rh-skills promote concept write <topic>   (writes terminology artifact during implement)

schema_version: "1.0"

description: >
  Governs the concept standardization phase for a clinical topic. Aggregates clinical
  concepts from normalized source front matter, tracks MCP-based code lookup state, and
  gates the extract phase until all concepts are approved. Each concept entry must be
  enriched with standardized codes (SNOMED-CT, ICD-10-CM, LOINC, RxNorm) via
  ReasonHub MCP before the extract plan can be finalized.

# ── Top-level fields (machine-readable for validation) ────────────────────────

required_fields:
  - topic          # topic slug (kebab-case)
  - status         # plan-level gate: pending-review | approved | rejected
  - concept_count  # integer count; must equal len(concepts[])
  - generated_at   # ISO 8601 timestamp set at generation time
  - concepts       # list of concept entries (see concept_entry_fields below)

optional_fields:
  - reviewed_at      # ISO 8601 timestamp; null until approved
  - reviewer         # name or agent identifier of the reviewer
  - review_summary   # narrative summary written at approval time
  - source           # origin of the concept list, e.g. normalized-frontmatter
  - lookup_completed # bool; true when all concept entries have lookup_completed: true
  - lookup_policy    # mapping; governs MCP lookup behaviour (see lookup_policy_fields)
  - review_artifact  # relative path back to this file (informational)
  - final_artifact   # relative path to the output terminology artifact (informational)

status_values:
  - pending-review   # default; extract plan is blocked until this is approved
  - approved         # all concepts reviewed and codes committed; extract may proceed
  - rejected         # plan must be regenerated with corrected source annotations

review_status_values:
  - pending-review   # concept has not yet been reviewed
  - approved         # codes[] accepted by reviewer; concept will appear in terminology artifact
  - rejected         # concept rejected; will be excluded from terminology artifact
  - needs-revision   # codes[] need correction before approval

# ── Per-concept entry fields ──────────────────────────────────────────────────

concept_entry_fields:

  name:
    type: string
    required: true
    description: >
      Human-readable concept label as it appears in the source front matter.
      Used as the lookup_query seed for MCP code lookup.
    example: "Hypertension"

  type:
    type: string
    required: true
    description: >
      SNOMED semantic tag for the concept, e.g. finding | disorder | procedure |
      observable entity | substance. Controls which code systems are applicable.
    example: "disorder"

  review_status:
    type: string
    required: true
    allowed_values: [pending-review, approved, rejected, needs-revision]
    description: >
      Per-concept reviewer gate. The plan-level status cannot be set to 'approved'
      while any concept has review_status: pending-review or needs-revision.

  sources:
    type: list   # list of source name strings
    required: false
    description: >
      Normalized source names (without extension) from which this concept was
      extracted. Used for provenance tracking.
    example: ["ada-guidelines", "uspstf-diabetes"]

  source_files:
    type: list   # list of relative file paths
    required: false
    description: >
      Relative paths to the normalized source files (e.g.
      sources/normalized/<name>.md) from which the concept was aggregated.

  lookup_completed:
    type: boolean
    required: false
    description: >
      True when ReasonHub MCP lookup has been run for this concept and
      candidate_codes[] has been populated (even if empty). Does not imply
      that codes[] has been approved.

  lookup_query:
    type: string
    required: false
    description: >
      The exact query string passed to ReasonHub MCP. Defaults to the concept
      name; may be updated if the initial query returns poor results.

  candidate_codes:
    type: list   # list of {system, code, display, relationship?} mappings
    required: false
    description: >
      MCP lookup results awaiting reviewer selection. Entries use the same
      structure as codes[] but are not yet approved. Clear after approval.

  codes:
    type: list   # list of {system, code, display, related[]?} mappings
    required: false
    description: >
      Reviewer-approved codes for this concept. These are written verbatim into
      the terminology artifact when the plan is finalized via 'concept write'. Each entry:
        system:   code system URI or short name (SNOMED-CT | ICD-10-CM | LOINC | RxNorm)
        code:     code value
        display:  canonical display name
        related:  optional list of within-system is-a descendants
                  [{system, code, display, relationship: is-a}]
      Cross-system equivalences belong as sibling codes[] entries, NOT related[].

  expansions:
    type: list   # list of {system, filter, rationale?} mappings
    required: false
    description: >
      Reviewer-included expansion rules for this concept (intentional valueset
      definitions). Written into the terminology artifact alongside codes[]. Each entry:
        system:    code system URI (e.g. http://snomed.info/sct)
        filter:    expansion filter expression (e.g. "is_a 38341003")
        rationale: optional reviewer rationale string

  review_notes:
    type: string
    required: false
    description: >
      Free-text notes from the reviewer. Record rationale for code selection,
      exclusions, or deferral decisions.

# ── Lookup policy fields ──────────────────────────────────────────────────────

lookup_policy_fields:

  service:
    type: string
    description: >
      MCP service to use for code lookup. Currently always 'reasonhub-mcp'.

  directive:
    type: string
    description: >
      Instruction to the agent performing lookup. Currently always
      'use-mcp-to-identify-standardized-codes'.

  approval_order:
    type: string
    description: >
      Expected human workflow order. Currently always
      'dedupe-then-mcp-lookup-then-human-approval'.
