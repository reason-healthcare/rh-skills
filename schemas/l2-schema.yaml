# L2 Semi-Structured Artifact Schema
# Validation reference for rh-skills validate command
# Required fields → exit 1 if missing
# Optional fields → warn if missing

schema_version: "1.0"

required_fields:
  - id              # unique artifact identifier (kebab-case)
  - name            # short machine name
  - title           # human-readable title
  - version         # semver string e.g. "1.0.0"
  - status          # lifecycle: draft | active | retired
  - domain          # clinical domain e.g. "diabetes" | "sepsis"
  - description     # human-readable description (≥1 sentence)
  - derived_from    # list of L1 artifact names this was derived from

# Fields listed here generate a warning when absent from any L2 artifact.
# Only include fields that are meaningful for ALL artifact types.
# Type-specific fields (concepts, codings) and extract-workflow fields
# (artifact_type, clinical_question, sections, concerns) are validated
# separately by _validate_extract_artifact and do not belong here.
optional_fields:
  - clinical_context   # additional clinical narrative
  - references         # list of reference strings (PMIDs, URLs, guidelines)
  - tags               # list of free-text tags
  - author             # author name or team

# The following fields exist on L2 artifacts but are NOT universally warned
# because they are either extract-workflow-specific (enforced by extract-plan
# validation) or only applicable to certain artifact types:
#
#   artifact_type      — enforced as error by extract-plan validation
#   clinical_question  — enforced as error by extract-plan validation
#   sections           — enforced as error by extract-plan validation
#   concerns           — enforced by extract-plan validation when concerns listed in plan
#   conflicts          — legacy alias for concerns; no value in warning about old name
#   review_status      — auxiliary reviewer state; not universally applicable
#   codings            — {code, system, display} codes; only for assessment/terminology
#   concepts           — concept catalog; only for terminology artifact type
                       # Structure:
                       #   concepts:
                       #   - name: <human-readable concept label>  # required
                       #     type: <SNOMED semantic tag, e.g. finding | disorder | procedure | observable entity>  # required
                       #     role: <optional clinical role>        # optional; one of:
                       #           inclusion-criterion | exclusion-criterion | intervention |
                       #           comparator | comorbidity | observation |
                       #           risk-factor | outcome | adverse-event | other
                       #     context: <~10-word text window from source around first occurrence>  # optional
                       #     codes:                                # optional; omitted if no approved code
                       #     - system: <code system URI, e.g. http://snomed.info/sct | http://hl7.org/fhir/sid/icd-10-cm>  # required
                       #       code: <code value>                  # required
                       #       display: <canonical display name>   # required
                       # Rules:
                       #   - Each concept entry is deduplicated by (name, type). The same concept name
                       #     with a different type produces separate entries. Roles from all sources are
                       #     unioned into a single role field (semicolon-separated when multiple).
                       #   - codes[] maps the concept across code systems; each (system, code) pair appears at most once per concept.
                       #   - context is extracted at ingest annotate time from the first body-text occurrence of the concept name.
                       #   - Custom concepts (not extracted from source documents) are added via
                       #     'concept enrich --source custom'; their sources value is 'custom'.
                       #   - related_codes[] is NOT written at L2; ECL-based expansion moves to L3 formalization.

artifact_types:
  - eligibility-criteria
  - risk-factors
  - evidence-summary
  - decision-table
  - care-pathway
  - terminology
  - measure
  - assessment
  - policy
  - custom

# ── Care-pathway vs. decision-table: When to use each ────────────────────────
#
# CARE-PATHWAY
#   Use when source describes: sequential workflow, care phases, ordered steps,
#   care progression, pathway structure, or "do step A, then step B, then C".
#   
#   Structure: Flat steps[] with optional parent_id hierarchy links.
#   Keep actor on steps when known. When a paired decision table defines
#   pathway_phases, care-pathway steps should mirror that canonical phase model 1:1.
#
# DECISION-TABLE
#   Use when source describes: event-triggered decisions, conditional logic,
#   "when X happens and Y is true, then recommend Z", clinical decision rules.
#   
#   Structure: Events, conditions, actions, and rules that bind them together.
#   Each rule fires when an event occurs and conditions are met, then executes
#   actions. Rules are flat, not hierarchical.
#
# Key distinction:
#   - Care-pathway = workflow sequence (what happens in what order)
#   - Decision-table = conditional logic (when to recommend specific actions)
#
# ─────────────────────────────────────────────────────────────────────────────

artifact_type_sections:
  care-pathway:
    description: >
      Sequential care workflow with flat steps linked by transitions.
      Use when source describes ordered activities in a care journey. When a
      paired decision table exists, align the top-level steps to its
      pathway_phases 1:1.
    recommended_sections:
      - summary
      - evidence_traceability
      - steps
      - transitions
    section_definitions:
      steps: >
        Flat workflow steps. Each entry: {id, label, description?, actor?, parent_id?,
        applicability_condition?}. parent_id references another step id when a
        nested relationship is needed. When a paired decision table defines
        pathway_phases, keep care-pathway steps aligned 1:1 with that phase model.
        Actions are defined in decision-table artifacts, not in care pathways.
      transitions: >
        Optional sequencing rules between steps or phases: {from_id, to_id,
        condition?, description?}. Captures dependencies and branching logic.

  decision-table:
    description: >
      Event-condition-action (ECA) decision logic. Use when source describes
      conditional recommendations or event-triggered clinical decisions.
    recommended_sections:
      - summary
      - evidence_traceability
      - events
      - conditions
      - actions
      - rules
    section_definitions:
      events: >
        ECA trigger event definitions: {id, label, description?, trigger_type, phase?}.
        trigger_type: named-event | data-changed | periodic.
      conditions: >
        Condition definitions: {id, label, description?, values[]}.
        values[] MUST use booleans (true/false), not "Yes"/"No".
      actions: >
        Action definitions: {id, label, description?, type, intent?}.
        Actions represent clinical recommendations or workflow consequences.
      rules: >
        ECA bindings: {id, event, when{}, then[], action?, rationale?, description?, phase?}.
        Each rule references an event, maps condition ids to values
        in 'when', and lists action ids in 'then'. The 'phase' field (optional)
        references pathway_phases[].id when pathway_phases section is present,
        enabling grouping of rules by care phase.

status_values:
  - draft
  - active
  - retired
