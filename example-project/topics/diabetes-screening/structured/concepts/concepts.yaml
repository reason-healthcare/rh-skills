concepts:
- id: fasting-plasma-glucose
  name: Fasting plasma glucose
  type: observable entity
  role:
  - observation
  context: 'is diagnosed by any one of the following criteria: 1. **Fasting plasma
    glucose (FPG)** >=126 mg/dL (7.0 mmol/L) - fasting defined as no'
  codes:
  - system: http://loinc.org
    code: 1558-6
    display: Fasting glucose [Mass/volume] in Serum or Plasma
- id: hemoglobin-a1c
  name: Hemoglobin A1C
  type: observable entity
  role:
