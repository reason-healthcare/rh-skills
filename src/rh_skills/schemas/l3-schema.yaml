# L3 Computable Artifact Schema (Retired)
#
# This schema is retained only as documentation for the deprecated intermediate
# YAML model previously used by `promote combine`.
#
# Current branch behavior:
# - `rh-skills formalize` writes direct FHIR JSON resources to
#   `topics/<topic>/computable/`
# - `rh-skills validate <topic> l3 <artifact>` validates tracked/generated FHIR
#   JSON outputs, not a custom intermediate YAML body
# - `promote combine` is deprecated and should not be used as the primary L3
#   workflow
#
# Treat this file as legacy reference material, not as the authoritative
# contract for current L3/computable outputs.

schema_version: "1.0"
status: legacy
authoritative_for_current_cli: false

description: >
  Legacy intermediate L3 YAML contract retained only for historical reference.
  Current computable outputs are direct FHIR JSON resources emitted by
  `rh-skills formalize` and validated by `rh-skills validate`.

legacy_required_fields:
  - artifact_schema_version    # legacy intermediate root marker
  - metadata                   # legacy metadata block
  - converged_from             # legacy list of L2 artifact names

current_l3_contract:
  output_format: >
    Direct FHIR JSON resources in topics/<topic>/computable/
  primary_commands:
    - rh-skills formalize <topic> <artifact>
    - rh-skills validate <topic> l3 <artifact>
    - rh-skills package <topic> --pack
  validation_behavior:
    - validates tracked/generated FHIR JSON resources
    - may skip intermediate-section checks when no intermediate L3 body is tracked
  note: >
    If you need CQL validation, validate the emitted Library/CQL artifacts and
    PlanDefinition references rather than authoring against this retired
    intermediate schema.

legacy_optional_sections:
  pathways:
    description: Legacy care pathways / workflows block
    fhir_equivalent: PlanDefinition
  actions:
    description: Legacy discrete clinical actions / recommendations block
    fhir_equivalent: ActivityDefinition
  libraries:
    description: Legacy reusable CQL logic library block
    fhir_equivalent: Library
  measures:
    description: Legacy clinical quality measure block
    fhir_equivalent: Measure
  assessments:
    description: Legacy clinical assessment instrument block
    fhir_equivalent: Questionnaire
  value_sets:
    description: Legacy coded value set block
    fhir_equivalent: ValueSet
  code_systems:
    description: Legacy code system reference block
    fhir_equivalent: CodeSystem
