# L2 Semi-Structured Artifact Schema
# Validation reference for rh-skills validate command
# Required fields → exit 1 if missing
# Optional fields → warn if missing

schema_version: "1.0"

required_fields:
  - id              # unique artifact identifier (kebab-case)
  - name            # short machine name
  - title           # human-readable title
  - version         # semver string e.g. "1.0.0"
  - status          # lifecycle: draft | active | retired
  - domain          # clinical domain e.g. "diabetes" | "sepsis"
  - description     # human-readable description (≥1 sentence)
  - derived_from    # list of L1 artifact names this was derived from

# Fields listed here generate a warning when absent from any L2 artifact.
# Only include fields that are meaningful for ALL artifact types.
# Type-specific fields (concepts, codings) and extract-workflow fields
# (artifact_type, clinical_question, sections, concerns) are validated
# separately by _validate_extract_artifact and do not belong here.
optional_fields:
  - clinical_context   # additional clinical narrative
  - references         # list of reference strings (PMIDs, URLs, guidelines)
  - tags               # list of free-text tags
  - author             # author name or team

# The following fields exist on L2 artifacts but are NOT universally warned
# because they are either extract-workflow-specific (enforced by extract-plan
# validation) or only applicable to certain artifact types:
#
#   artifact_type      — enforced as error by extract-plan validation
#   clinical_question  — enforced as error by extract-plan validation
#   sections           — enforced as error by extract-plan validation
#   concerns           — enforced by extract-plan validation when concerns listed in plan
#   conflicts          — legacy alias for concerns; no value in warning about old name
#   review_status      — auxiliary reviewer state; not universally applicable
#   codings            — {code, system, display} codes; only for assessment/terminology
#   concepts           — concept catalog; only for terminology artifact type
                       # Structure:
                       #   concepts:
                       #   - id: <stable concept identifier, kebab-case> # required
                       #     name: <human-readable concept label>  # required
                       #     type: <SNOMED semantic tag, e.g. finding | disorder | procedure | observable entity>  # required
                       #     role: <optional clinical role>        # optional; one of:
                       #           inclusion-criterion | exclusion-criterion | intervention |
                       #           comparator | comorbidity | observation |
                       #           risk-factor | outcome | adverse-event | other
                       #     context: <~10-word text window from source around first occurrence>  # optional
                       #     codes:                                # optional; omitted if no approved code
                       #     - system: <code system URI, e.g. http://snomed.info/sct | http://hl7.org/fhir/sid/icd-10-cm>  # required
                       #       code: <code value>                  # required
                       #       display: <canonical display name>   # required
                       # Rules:
                       #   - Each concept entry is deduplicated by (name, type). The same concept name
                       #     with a different type produces separate entries. Roles from all sources are
                       #     unioned into a single role field (semicolon-separated when multiple).
                       #   - codes[] maps the concept across code systems; each (system, code) pair appears at most once per concept.
                       #   - context is extracted at ingest annotate time from the first body-text occurrence of the concept name.
                       #   - Custom concepts (not extracted from source documents) are added via
                       #     'concept enrich --source custom'; their sources value is 'custom'.
                       #   - related_codes[] is NOT written at L2; ECL-based expansion moves to L3 formalization.
                       #
                       #   terminology sections:
                       #   sections.value_sets[] is a thin manifest of computable ValueSets.
                       #   It references reviewed concepts by concepts[].id rather than duplicating
                       #   approved codes or expansions inline.

artifact_types:
  - eligibility-criteria
  - risk-factors
  - evidence-summary
  - decision-table
  - care-pathway
  - terminology
  - measure
  - assessment
  - policy
  - custom

# ── Care-pathway vs. decision-table disambiguation ───────────────────────────
#
# CARE-PATHWAY (→ PlanDefinition type=clinical-protocol)
#   Models a care sequence: phases, steps, and nested sub-steps.
#   In FHIR: action.action[] nesting represents the workflow hierarchy.
#   Actions in a pathway are ACTIVITIES, not event-triggered rules.
#   A pathway step may carry an applicability condition (action.condition with
#   kind=applicability) to gate whether the step applies — but it does NOT
#   carry action.trigger. The pathway is invoked as a whole; triggers do not
#   live on individual steps.
#
# DECISION-TABLE / POLICY (→ PlanDefinition type=eca-rule)
#   Models event-triggered logic: when event X occurs and condition Y is met,
#   perform action Z.
#   In FHIR: action.trigger captures the named or data-changed event that
#   fires the rule. Actions are RECOMMENDATIONS or orders that execute when
#   the rule fires. No meaningful action.action[] nesting — each rule is flat.
#
# Extraction signal:
#   Source text describes phases/steps/activities in a care sequence → care-pathway
#   Source text describes "if event occurs, then recommend X"         → decision-table
#
# ─────────────────────────────────────────────────────────────────────────────

artifact_type_sections:
  care-pathway:
    description: >
      Sequential care workflow intended for downstream PlanDefinition
      (clinical-protocol) formalization. Captures hierarchical workflow
      nodes (phases, steps, sub-steps). Do NOT include ECA trigger events
      here — use decision-table for event-triggered logic.
    recommended_sections:
      - summary
      - evidence_traceability
      - steps
      - transitions
    section_definitions:
      steps: >
        Hierarchical workflow nodes. Each entry: {id, label, description?,
        parent_id?, action_type?, applicability_condition?}. Use parent_id
        to express nesting (phase → step → sub-step). These become nested
        action.action[] entries in a FHIR clinical-protocol PlanDefinition.
        action_type is the type of clinical activity (order, referral,
        assessment, communication, etc.). applicability_condition is an
        optional free-text gate on whether the step applies within a
        running pathway instance — distinct from an ECA trigger event.
      transitions: >
        Optional. Sequencing rules between steps or phases: {from_id, to_id,
        condition?, description?}. Captures dependencies and branching logic
        within the pathway. These become action.relatedAction entries in FHIR.

  decision-table:
    description: >
      Event-condition-action (ECA) decision logic intended for downstream
      PlanDefinition (eca-rule) formalization. Do NOT capture hierarchical
      workflow step nesting here — use care-pathway for pathway structure.
    recommended_sections:
      - summary
      - evidence_traceability
      - events
      - conditions
      - actions
      - rules
    section_definitions:
      events: >
        ECA trigger event definitions, typically {id, label, description?,
        trigger_type?}. trigger_type: named-event | data-changed | periodic.
        These become action.trigger entries in a FHIR eca-rule PlanDefinition.
        Do NOT use this section to model care-pathway entry conditions or
        workflow step applicability — those belong in care-pathway.steps.
      conditions: >
        List of condition definitions, typically {id, label, description?,
        values[]}. Conditions represent the decision inputs or threshold tests.
        These become action.condition (kind=applicability) entries in FHIR.
      actions: >
        List of action definitions, typically {id, label, description?, type?,
        intent?}. Actions represent the clinical recommendation or workflow
        consequence of a rule firing. These are flat — not nested workflow
        steps. Use care-pathway.steps for sequenced workflow hierarchies.
      rules: >
        List of ECA bindings, typically {id, event?, when{}, then[]}. Each
        rule references one event (optional when global), maps condition ids to
        values in `when`, and lists action ids in `then`.

status_values:
  - draft
  - active
  - retired
