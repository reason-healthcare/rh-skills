# L2 Semi-Structured Artifact Schema
# Validation reference for rh-skills validate command
# Required fields → exit 1 if missing
# Optional fields → warn if missing

schema_version: "1.0"

required_fields:
  - id              # unique artifact identifier (kebab-case)
  - name            # short machine name
  - title           # human-readable title
  - version         # semver string e.g. "1.0.0"
  - status          # lifecycle: draft | active | retired
  - domain          # clinical domain e.g. "diabetes" | "sepsis"
  - description     # human-readable description (≥1 sentence)
  - derived_from    # list of L1 artifact names this was derived from

# Fields listed here generate a warning when absent from any L2 artifact.
# Only include fields that are meaningful for ALL artifact types.
# Type-specific fields (concepts, codings) and extract-workflow fields
# (artifact_type, clinical_question, sections, concerns) are validated
# separately by _validate_extract_artifact and do not belong here.
optional_fields:
  - clinical_context   # additional clinical narrative
  - references         # list of reference strings (PMIDs, URLs, guidelines)
  - tags               # list of free-text tags
  - author             # author name or team

# The following fields exist on L2 artifacts but are NOT universally warned
# because they are either extract-workflow-specific (enforced by extract-plan
# validation) or only applicable to certain artifact types:
#
#   artifact_type      — enforced as error by extract-plan validation
#   clinical_question  — enforced as error by extract-plan validation
#   sections           — enforced as error by extract-plan validation
#   concerns           — enforced by extract-plan validation when concerns listed in plan
#   conflicts          — legacy alias for concerns; no value in warning about old name
#   review_status      — auxiliary reviewer state; not universally applicable
#   codings            — {code, system, display} codes; only for assessment/terminology
#   concepts           — concept catalog; only for terminology artifact type
                       # Structure:
                       #   concepts:
                       #   - name: <human-readable concept label>  # required
                       #     type: <SNOMED semantic tag, e.g. finding | disorder | procedure | observable entity>  # required
                       #     role: <optional clinical role>        # optional; one of:
                       #           inclusion-criterion | exclusion-criterion | intervention |
                       #           comparator | comorbidity | observation |
                       #           risk-factor | outcome | adverse-event | other
                       #     context: <~10-word text window from source around first occurrence>  # optional
                       #     codes:                                # optional; omitted if no approved code
                       #     - system: <code system URI, e.g. http://snomed.info/sct | http://hl7.org/fhir/sid/icd-10-cm>  # required
                       #       code: <code value>                  # required
                       #       display: <canonical display name>   # required
                       # Rules:
                       #   - Each concept entry is deduplicated by (name, type). The same concept name
                       #     with a different type produces separate entries. Roles from all sources are
                       #     unioned into a single role field (semicolon-separated when multiple).
                       #   - codes[] maps the concept across code systems; each (system, code) pair appears at most once per concept.
                       #   - context is extracted at ingest annotate time from the first body-text occurrence of the concept name.
                       #   - Custom concepts (not extracted from source documents) are added via
                       #     'concept enrich --source custom'; their sources value is 'custom'.
                       #   - Approved related terminology rows may be written at L2 as
                       #     concepts[].codes[].related[]. Expansion expressions remain inputs
                       #     to review/formalization rather than generic free-form membership.

artifact_types:
  - eligibility-criteria
  - risk-factors
  - evidence-summary
  - decision-table
  - care-pathway
  - terminology
  - measure
  - assessment
  - policy
  - custom

# ── Care-pathway vs. decision-table: When to use each ────────────────────────
#
# CARE-PATHWAY
#   Use when source describes: sequential workflow, care phases, ordered steps,
#   care progression, pathway structure, or "do step A, then step B, then C".
#   
#   Structure: Flat steps[] with optional parent_id hierarchy links.
#   Keep actor on steps when known. When a paired decision table defines
#   pathway_phases, care-pathway steps should mirror that canonical phase model 1:1.
#   applicability_condition gates whether a pathway step applies inside the
#   workflow; it is not an event trigger.
#
# DECISION-TABLE
#   Use when source describes: event-triggered decisions, conditional logic,
#   "when X happens and Y is true, then recommend Z", clinical decision rules.
#   
#   Structure: Events, conditions, actions, and rules that bind them together.
#   Each rule fires when an event occurs and conditions are met, then executes
#   actions. Rules are flat, not hierarchical.
#   Trigger semantics belong in events[].trigger, not in care-pathway steps.
#
# Key distinction:
#   - Care-pathway = workflow sequence (what happens in what order)
#   - Decision-table = conditional logic (when to recommend specific actions)
#
# ─────────────────────────────────────────────────────────────────────────────

artifact_type_sections:
  care-pathway:
    description: >
      Sequential care workflow with flat steps linked by transitions.
      Use when source describes ordered activities in a care journey. When a
      paired decision table exists, align the top-level steps to its
      pathway_phases 1:1.
    recommended_sections:
      - summary
      - evidence_traceability
      - steps
      - transitions
    section_definitions:
      evidence_traceability: >
        Evidence claims that support recommendation content:
        {claim_id, statement, strength?, recommendation_grade?, evidence[]}. claim_id must be unique
        per artifact and is referenced by recommendation-like steps through
        evidence_traceability_ids[]. Add strength only when the source reports
        evidence certainty/quality; do not infer it from source type or a
        recommendation grade. Preserve an explicitly reported recommendation
        grade separately in recommendation_grade (for example, USPSTF Grade B
        or C). If the source does not report a certainty/quality, omit strength.
        When strength is supplied, use validator-supported values such as high |
        moderate | low | very-low | consensus | insufficient.
      steps: >
        Flat workflow steps. Each entry: {id, label, description?, actor?, parent_id?,
        applicability_condition?, applicability_conditions[]?, rule_id?, rule_ids[]?, action_labels?,
        evidence_traceability_ids[]?, provenance?}. parent_id references
        another step id when a nested relationship is needed. When a paired
        decision table defines pathway_phases, keep care-pathway steps aligned
        1:1 with that phase model. Use rule_id to point a step at a specific
        decision-table rule it orchestrates, or rule_ids[] when a leaf step
        intentionally groups a tight cluster of related rules with the same
        pathway meaning. Use action_labels to name the corresponding
        decision-table actions for readability. Parent steps that also have
        child steps must not carry rule_id or rule_ids[]; push recommendation
        linkage down to the leaf step that owns it. For recommendation-like
        steps (rule_id/rule_ids[]/action_labels present), include
        evidence_traceability_ids[] linking to
        sections.evidence_traceability[].claim_id and provenance metadata such
        as {source: source_direct|inferred, rationale?}. Inferred
        recommendations should always include rationale. When both a
        decision-table and care-pathway are present, every
        recommendation-scoped decision-table rule should appear in at least one
        care-pathway leaf step's rule_id or rule_ids[] linkage.
        applicability_condition is a local pathway gate, not an event trigger.
        Use applicability_conditions[] when a step requires multiple gates;
        all listed condition IDs, together with applicability_condition when
        present, are conjunctive. Keep every gate explicit in the L2 source.
        Recommendation links are resolved only from rule_id/rule_ids[]; prose
        similarity does not establish a decision-table binding.
        Actions are defined in decision-table artifacts, not in care pathways;
        use care-pathway only for sequencing and orchestration.
      transitions: >
        Optional sequencing links between steps or phases:
        {from_id, to_id, description?}. Captures pathway order. Put step
        applicability or branch gates on the destination step with
        applicability_condition rather than on the transition.

  decision-table:
    description: >
      Event-condition-action (ECA) decision logic. Use when source describes
      conditional recommendations or event-triggered clinical decisions.
    recommended_sections:
      - summary
      - evidence_traceability
      - pathway_phases
      - events
      - conditions
      - data_elements
      - actions
      - rules
    section_definitions:
      evidence_traceability: >
        Evidence claims that support decision logic:
        {claim_id, statement, strength?, recommendation_grade?, evidence[]}. claim_id must be unique per
        artifact and is referenced from actions and rules via
        evidence_traceability_ids[]. Add strength only when the source reports
        evidence certainty/quality; do not infer it from source type or a
        recommendation grade. Preserve an explicitly reported recommendation
        grade separately in recommendation_grade (for example, USPSTF Grade B
        or C). If the source does not report a certainty/quality, omit strength.
        When strength is supplied, use validator-supported values such as high |
        moderate | low | very-low | consensus | insufficient.
      pathway_phases: >
        Optional canonical phase model for phase-organized narratives:
        {id, label, description?}. Use only when the source clearly groups
        recommendations by care phase or workflow stage. When present, define
        phases under sections.pathway_phases[] (not top-level pathway_phases)
        and keep events[].phase and rules[].phase aligned to
        pathway_phases[].id values.
      events: >
        ECA workflow event definitions:
        {id, label, description?, phase?, trigger?, applicability[]?}.
        Events are primary. trigger is optional when the workflow context alone
        is enough. When present, trigger must be an object with a
        FHIR-compatible type such as named-event | periodic | data-changed |
        data-added | data-modified | data-removed | data-accessed |
        data-access-ended. trigger may also carry optional fields such as
        name, source, resource, moment, resource_criteria, and timing_window
        when the source supports them. Use applicability[] for event-wide
        condition ids that apply to all or most rules at that event so those
        conditions do not repeat in rules.when{}. Use events[] for trigger
        semantics, not for care-pathway step applicability or sequencing.
      applicability: >
        Optional artifact-wide applicability condition ids for scope shared by
        the decision table, such as adult population, diagnosis scope, or topic
        inclusion. Use this to hoist repeated guideline-wide conditions out of
        per-rule rules.when{} clauses.
      conditions: >
        Case feature / condition definitions:
        {id, label, description?, values[], resolution?}. values[] MUST use
        canonical Yes/No values. A condition is the resolved case feature that
        rules consume; it is not itself classified as observed or inferred.
        Use optional resolution metadata when the feature value is resolved from
        supporting data elements: {operator?, inputs[]?, summary?,
        unknown_policy?}. Supported neutral operators include exists, any_of,
        all_of, count_at_least, threshold, comparison, classification, and
        calculation. inputs[] references data_elements[].id values for the same
        condition. Keep this L2 logic clinical and implementation-neutral; do
        not encode FHIR resource assumptions here.
      data_elements: >
        Supporting data elements for resolving each case feature:
        {id, condition_id, label, description?, data_type?, role?,
        value_type?, produced_by[]?, evidence_source?, temporal_scope?}.
        Every condition in conditions[] MUST have at least one corresponding
        data_elements[] entry via condition_id. Use role to describe how the
        data participates in feature resolution: direct_evidence,
        inference_input, assessment_output, context, calculation_input, or
        derived_value. Missing role defaults to direct_evidence. Use value_type
        for implementation-neutral value shape: presence, boolean, quantity,
        codeable_concept, date_time, interval, ordinal, or text. Use
        produced_by[] to reference action ids that produce this data element.
        evidence_source and temporal_scope remain clinical descriptions, not
        FHIR mapping hints.
      actions: >
        Action definitions: {id, label, description?, kind?,
        intent?, parent_action_id?, concept_refs[]?, code?, codings[]?,
        produces_conditions[]?, produces_data_elements[]?,
        assessment_artifact?, evidence_traceability_ids[]?, provenance?}.
        Actions represent clinical recommendations or workflow consequences.
        Use parent_action_id when a supporting action belongs under a broader
        parent action. Parent actions with children are PlanDefinition grouping
        nodes only: omit kind and put executable kind on their child leaf
        actions. Leaf executable actions (actions without child actions) MUST
        carry kind. Use medication for MedicationRequest; service, procedure,
        referral, or assessment for ServiceRequest; questionnaire for
        CollectInformation; and communication for CommunicationRequest. Avoid
        Task because it is too generic. Use guidance only for source-faithful,
        non-order recommendation text that remains inline in PlanDefinition;
        guidance never emits an ActivityDefinition or inferred clinical code.
        Leaf executable actions should
        routinely carry concept_refs[] and/or explicit coding via code or
        codings[] so formalize can reuse reviewed
        terminology rather than re-inferring it. Use produces_data_elements[]
        when an action produces concrete findings, scores, assessments, or
        other evidence items that later logic consumes. Avoid using
        produces_conditions[] for new artifacts; task/action output should be
        modeled as produced data elements, and conditions should resolve from
        those data elements. Use assessment_artifact when an action
        explicitly administers or reviews a structured assessment instrument
        that should formalize to a Questionnaire. Include
        evidence_traceability_ids[] to link each action to one or more
        evidence_traceability claim_id values, and provenance metadata such as
        {source: source_direct|inferred, rationale?}. Inferred recommendations
        should always include rationale. Actions are flat recommendation or
        workflow-consequence definitions, not nested care-pathway structure.
      rules: >
        ECA bindings: {id, event, when{}?, then[], action?, rationale?, description?, phase?, evidence_traceability_ids[]?, provenance?}.
        Each rule references an event and lists action ids in 'then'.
        Use 'when' when the source describes an additional branch condition;
        omit it for unconditional event-driven rules. The 'phase' field
        (optional) references pathway_phases[].id when pathway_phases
        section is present, enabling grouping of rules by care phase. Include
        evidence_traceability_ids[] to link recommendation logic to one or more
        evidence_traceability claim_id values and provenance metadata such as
        {source: source_direct|inferred, rationale?}. Inferred recommendations
        should always include rationale.

  assessment:
    description: >
      Structured assessment instrument and response semantics. Questionnaire
      extraction metadata is optional and must be explicit when downstream
      workflows require SDC Observation extraction.
    recommended_sections:
      - summary
      - instrument
      - items
      - scoring
      - evidence_traceability
    section_definitions:
      instrument: >
        Assessment instrument identity and scope. Optional version_algorithm:
        {system, code, display?}; when SDC Observation extraction is enabled,
        author this Coding explicitly because the versioned SDC profile
        requires Questionnaire version algorithm metadata. Formalize preserves
        it in the standard artifact-versionAlgorithm extension. Optional
        observation_extraction is the supported SDC contract:
        {profile: '<SDC observation-extraction profile canonical>|<version>',
        enabled: true|false, category?: {system, code, display}}. If enabled,
        provide category with all three non-empty strings and version_algorithm.
        Only these fields are supported; do not pass arbitrary FHIR extensions
        through L2. Without observation_extraction, ordinary assessments may
        use supported response types, options, and scoring without this metadata.
        Formalize emits the authored profile, extraction enable extension,
        and category extension. Omit the field when extraction is not part of
        the workflow.
      items: >
        Questionnaire items: {id, text, type, required?, code?}. Preserve
        source linkIds, answer types, requiredness, and full Coding identity
        including system, version, code, and display. Under SDC extraction,
        item codings are the terminology bindings copied to Observation.code.
        The currently supported extraction subset is Boolean items with
        exactly one reviewed Coding per item; that Coding requires system,
        version, code, and display. Do not infer a Coding when one is absent.
      scoring: >
        Scoring narrative remains optional for ordinary assessments. An
        assessment that publishes a calculated score Observation may use this
        optional structured contract: algorithm {method: count_boolean_answers,
        input_items: [source item ids], counted_value: true,
        completion: all_inputs_usable, missing_or_invalid: omit_result,
        evidence_traceability_ids: [claim ids]}; result {item: {id, text,
        type: integer, code: {system, version, code, display}}, range:
        {minimum: 0, maximum: number of input_items}}; and optional
        classifications[] {id, label, operator: greater_than_or_equal,
        threshold, evidence_traceability_ids: [claim ids]}. This bounded method
        requires distinct required Boolean source items, an enabled SDC
        Observation-extraction contract, and source-linked claims. It computes
        the number of true answers only when each named item has exactly one
        usable Boolean; missing, duplicate, or invalid answers produce no
        score. The integer score has no FHIR unit element; describe its count
        semantics in the authored code definition. Do not infer a validated
        instrument, scoring algorithm, threshold, code, or clinical approval.
        Unsupported methods/operators must fail validation until deliberately
        implemented. No score block is required for assessments that do not
        source a scoring algorithm.

  terminology:
    description: >
      Governed concept codes and explicitly verified terminology expansions.
      Use when source content or the requested implementation depends on pinned
      code-system membership.
    recommended_sections:
      - summary
      - evidence_traceability
      - value_sets
    section_definitions:
      value_sets: >
        ValueSet specifications: {id, name?, system?, version?, codes[]?,
        concept_refs[]?, expansion?}. Use explicit codes and versions where
        membership is finite. An imported expansion is terminology-tool data,
        not an inferred or manually generated membership list. Its shape is
        {source: {provider, reference, response_timestamp, response_sha256},
        requested_compose: <exact FHIR ValueSet.compose>, response: <exact
        FHIR ValueSet.expansion element>}. The response hash is SHA-256 of the
        response JSON encoded as UTF-8 canonical compact JSON with sorted keys,
        no extra whitespace, and ensure_ascii=false. Preserve the provider,
        source reference, pinned requested composition, response timestamp, and
        returned `contains` entries. Formalize verifies the hash, compose
        identity, unique system|version|code membership, displays when authored,
        and total count before emitting the unchanged response expansion.
        Do not represent a search result as a complete expansion or substitute
        an unpinned later terminology version.
      code_systems: >
        Optional, locally authored complete CodeSystem definitions. Each entry
        is {id, url, version, content: complete, case_sensitive: boolean,
        concepts: [{code, display, definition}]}; name?, title?, and status?
        may be supplied. `id` must be a FHIR id, url/version are the authored
        canonical identity, and every concept definition is required. Do not
        derive a CodeSystem from a ValueSet or use this form for a partial or
        externally managed code system. When case_sensitive is false, codes
        differing only by case are duplicates. Formalize emits the exact local
        CodeSystem as a tracked L3 resource; pair it with an authored ValueSet
        when CQL membership selection is required.

status_values:
  - draft
  - active
  - retired
